[project]
name = "sf-agent"
version = "0.1.0"
description = "BayOne Snowflake query agent — grounded NL-to-answer over the warehouse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "snowflake-connector-python>=3.12",
    "cryptography>=42",
    "anthropic>=0.40",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    # Production process manager. Azure App Service runs the app as
    #   gunicorn -k uvicorn.workers.UvicornWorker sf_agent.web:app
    # Keep --workers at 1-2: the app shares ONE Snowflake connection behind a
    # module-level lock, so every extra worker opens its own warehouse session.
    "gunicorn>=22.0",
]
# Native document export (xlsx / docx / pptx / pdf) of the agent's grounded answers.
# Pure-Python writers with light deps — no headless browser or matplotlib needed.
docs = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "reportlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sf_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: hits a live Snowflake warehouse; skipped when creds are absent",
]
