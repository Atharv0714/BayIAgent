<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BayI Intelligence Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #faf8ff; --panel: #ffffff; --panel2: #f4f0fb; --border: #ddd0f2;
    --vborder: #c4aef0; --text: #1e1630; --muted: #6b6480; --accent: #7c3aed;
    --accent2: #d6249f; --danger: #e5484d; --code: #f6f3fb; --user: #efe4fc;
    /* BayOne logo palette — the four donut segments, light pink -> deep purple. */
    --bo-pink: #ec6ea9; --bo-magenta: #d6249f; --bo-deep: #c21e73; --bo-purple: #7a4e96;
    /* Montserrat echoes the geometric BAYONE wordmark; system sans stays for body copy. */
    --display: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); height: 100vh;
    display: flex; flex-direction: column;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 {
    font-family: var(--display); font-weight: 700; font-size: 16px; margin: 0; flex: 1;
    letter-spacing: .01em; display: flex; align-items: baseline; gap: 7px;
  }
  /* Wordmark treatment: "BAYI" in the heavy geometric weight with the logo gradient. */
  header h1 .wm {
    font-family: var(--display); font-weight: 800; font-size: 18px;
    letter-spacing: .02em; text-transform: uppercase;
    background: linear-gradient(120deg, var(--bo-purple), var(--bo-deep) 55%, var(--bo-pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header .sub { color: var(--muted); font-size: 12px; font-weight: 400; letter-spacing: 0; }
  /* Logo mark in the header sits between the wordmark, echoing the donut in BAYONE. */
  .bo-mark { display: inline-block; vertical-align: middle; flex: none; }
  select, button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; font: inherit;
    font-family: var(--display); font-weight: 600; font-size: 13px;
  }
  button { cursor: pointer; }
  button.primary {
    background: linear-gradient(135deg, var(--bo-purple), var(--bo-magenta) 60%, var(--bo-pink));
    color: #fff; border: 0; font-weight: 700;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }

  /* Layout: a persistent saved-chats sidebar to the left of the conversation. */
  .layout { flex: 1; display: flex; min-height: 0; }
  .content { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .sidebar {
    width: 252px; flex: none; border-right: 1px solid var(--border); background: var(--panel);
    display: flex; flex-direction: column; padding: 12px; gap: 10px; overflow-y: auto;
  }
  .sidebtn { width: 100%; }
  .sidebar h2 {
    font-family: var(--display); font-weight: 700; font-size: 11px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); margin: 4px 6px 0;
  }
  .chatlist { display: flex; flex-direction: column; gap: 3px; overflow-y: auto; }
  .chat-item {
    display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px;
    cursor: pointer; color: var(--text); font-size: 13px; border: 1px solid transparent;
  }
  .chat-item:hover { background: var(--panel2); }
  .chat-item.active { background: var(--panel2); border-color: var(--vborder); }
  .chat-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-del {
    flex: none; border: 0; background: transparent; color: var(--muted); font-size: 16px;
    padding: 0 5px; line-height: 1; opacity: 0; border-radius: 6px; font-family: inherit;
  }
  .chat-item:hover .chat-del, .chat-item.active .chat-del { opacity: 1; }
  .chat-del:hover { color: var(--danger); background: rgba(229,72,77,.1); }
  .chat-empty { color: var(--muted); font-size: 12px; padding: 8px 10px; }

  main { flex: 1; overflow-y: auto; }
  .thread { max-width: 820px; margin: 0 auto; padding: 24px 20px 8px; }
  .empty { color: var(--muted); text-align: center; margin-top: 12vh; }
  .empty > div:first-child { font-family: var(--display); font-weight: 600; color: var(--text); font-size: 15px; }
  .empty .chips { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 6px 13px; font-size: 13px; cursor: pointer;
    font-family: var(--display); font-weight: 600;
  }
  .chip:hover { color: var(--text); border-color: var(--accent2); }

  .msg { margin: 16px 0; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 88%; border-radius: 14px; padding: 12px 15px; }
  .user .bubble { background: var(--user); border: 1px solid var(--vborder); }
  .bot .bubble { background: var(--panel); border: 1px solid var(--vborder); width: 100%; }

  .badge {
    display: inline-block; background: rgba(214,36,159,.10); color: var(--accent2);
    border: 1px solid rgba(214,36,159,.35); border-radius: 8px; padding: 5px 11px;
    font-family: var(--display); font-weight: 800; font-size: 17px; margin-bottom: 10px;
    letter-spacing: .01em;
  }
  .answer { margin: 0; }
  /* Rendered markdown inside an answer (see mdToHtml). */
  .answer p { margin: 0 0 8px; }
  .answer p:last-child { margin-bottom: 0; }
  .answer ul, .answer ol { margin: 4px 0 8px; padding-left: 22px; }
  .answer li { margin: 2px 0; }
  .answer code { background: var(--code); border: 1px solid var(--border); border-radius: 4px; padding: 1px 4px; font-size: 12.5px; }
  .answer strong { font-weight: 700; }
  .answer .ahead { font-family: var(--display); font-weight: 700; font-size: 13.5px; margin: 10px 0 4px; color: var(--text); }
  .klabel { color: var(--muted); font-size: 12px; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .05em; font-family: var(--display); font-weight: 700; }
  .vname { font-family: var(--display); }

  /* Route pill: how the question was handled (database / follow-up / web), cited at the
     top of every answer. A colored dot keys the route; the reason follows in muted text. */
  .route {
    display: inline-flex; align-items: center; gap: 7px; margin-bottom: 10px;
    padding: 4px 11px; border-radius: 999px; font-family: var(--display);
    font-size: 11.5px; font-weight: 700; border: 1px solid var(--border);
    background: var(--panel2); max-width: 100%;
  }
  .route .rdot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .route .rlab { color: var(--text); text-transform: uppercase; letter-spacing: .05em; }
  .route .rreason { color: var(--muted); font-weight: 500; text-transform: none; letter-spacing: 0; }
  .route-database { border-color: rgba(122,78,150,.4); background: rgba(122,78,150,.08); }
  .route-database .rdot { background: var(--bo-purple); }
  .route-followup { border-color: rgba(124,58,237,.35); background: rgba(124,58,237,.08); }
  .route-followup .rdot { background: var(--accent); }
  .route-web { border-color: rgba(214,36,159,.35); background: rgba(214,36,159,.08); }
  .route-web .rdot { background: var(--bo-magenta); }

  /* Web-answer source citations. */
  .cites { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
  .cites li { margin: 3px 0; }
  .cites a { color: var(--accent2); text-decoration: none; }
  .cites a:hover { text-decoration: underline; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { border-bottom: 1px solid var(--border); padding: 5px 4px; vertical-align: top; }
  td.k { color: var(--muted); }

  /* Supporting-value sections */
  .vsection { margin-top: 12px; }
  .vname { font-weight: 600; font-size: 13px; margin-bottom: 5px; color: var(--text); }
  .vscroll { overflow-x: auto; }
  table.data th {
    text-align: left; color: var(--muted); font-weight: 600; font-size: 12px;
    padding: 5px 10px 6px; border-bottom: 1px solid var(--vborder); white-space: nowrap;
  }
  table.data td { padding: 6px 10px; }
  table.data tr:last-child td { border-bottom: 0; }
  table.kv td.k { width: 38%; white-space: nowrap; }
  .vscalar { font-size: 14px; margin: 0; }
  .vempty { color: var(--muted); font-style: italic; opacity: .85; }
  /* Nested object/list rendered inside a single cell (see cell()). */
  .kvp { display: inline-block; }
  .kvk { color: var(--muted); font-size: 12px; }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; font-family: var(--display); font-weight: 700; }
  .diag table { margin-top: 8px; font-size: 12.5px; }
  .diag td { padding: 5px 9px; }
  pre {
    background: var(--code); border: 1px solid var(--border); border-radius: 8px;
    padding: 11px; overflow-x: auto; font-size: 12.5px; margin: 8px 0 0; white-space: pre-wrap;
  }
  .meta { color: var(--muted); font-size: 11px; margin-top: 8px; }
  .err .bubble { border-color: rgba(229,72,77,.5); }
  .err .answer { color: var(--danger); }

  /* Loading state: the BayOne donut mark spinning, no text (replaces the old
     "Querying the warehouse…" line). The whole mark rotates while its segments
     gently pulse, so it reads as the logo coming to life rather than a plain spinner. */
  .bubble.loading { display: inline-flex; align-items: center; padding: 14px 16px; }
  .bo-spin { transform-origin: 50% 50%; animation: bo-rotate 1.15s cubic-bezier(.66,.15,.34,.85) infinite; }
  .bo-spin circle { animation: bo-pulse 1.15s ease-in-out infinite; }
  .bo-spin circle:nth-child(2) { animation-delay: .10s; }
  .bo-spin circle:nth-child(3) { animation-delay: .20s; }
  .bo-spin circle:nth-child(4) { animation-delay: .30s; }
  @keyframes bo-rotate { to { transform: rotate(360deg); } }
  @keyframes bo-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

  footer { border-top: 1px solid var(--border); background: var(--panel); }
  .composer { max-width: 820px; margin: 0 auto; padding: 14px 20px; display: flex; gap: 10px; align-items: flex-end; }
  /* Attach control + the chip shown once a file is attached. */
  #attachBtn {
    flex: none; width: 44px; height: 46px; padding: 0; font-size: 18px; line-height: 1;
    background: var(--panel2); border: 1px solid var(--vborder); border-radius: 10px;
  }
  #attachBtn:hover { border-color: var(--accent); }
  #attachBtn.busy { opacity: .5; cursor: default; }
  .attach-chip {
    max-width: 820px; margin: 0 auto; padding: 0 20px 8px; display: flex; align-items: center; gap: 8px;
  }
  .attach-pill {
    display: inline-flex; align-items: center; gap: 8px; background: var(--panel2);
    border: 1px solid var(--vborder); border-radius: 999px; padding: 5px 12px;
    font-family: var(--display); font-weight: 600; font-size: 12.5px; color: var(--text); max-width: 100%;
  }
  .attach-pill .ap-kind {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: #fff;
    background: var(--bo-purple); border-radius: 6px; padding: 1px 6px; font-weight: 700;
  }
  .attach-pill .ap-kind.template { background: var(--bo-magenta); }
  .attach-pill .ap-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 340px; }
  .attach-pill .ap-x { border: 0; background: transparent; color: var(--muted); font-size: 15px; cursor: pointer; padding: 0 2px; line-height: 1; }
  .attach-pill .ap-x:hover { color: var(--danger); }
  /* A small attachment tag inside a user message bubble. */
  .msg-attach { margin-top: 6px; font-size: 12px; color: var(--muted); }
  textarea {
    flex: 1; background: var(--panel2); color: var(--text); border: 1px solid var(--vborder);
    border-radius: 10px; padding: 11px 12px; font: inherit; resize: none; min-height: 46px; max-height: 180px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,58,237,.18); }
  .hint { max-width: 820px; margin: 0 auto; padding: 0 20px 10px; color: var(--muted); font-size: 11px; }

  /* Charts */
  .chartwrap {
    position: relative; height: 300px; margin-top: 6px; padding: 10px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 10px;
  }
  .charterr { color: var(--muted); font-size: 13px; font-style: italic; padding: 6px 2px; }

  /* Per-answer export bar: download this grounded answer as a native document. */
  .exportbar {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
  }
  .exlabel {
    color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    font-family: var(--display); font-weight: 700; margin-right: 4px;
  }
  .exbtn {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: 5px 12px; font-family: var(--display);
    font-weight: 600; font-size: 12px; cursor: pointer;
  }
  .exbtn:hover { border-color: var(--accent2); color: var(--accent2); }
  .exbtn:disabled { opacity: .5; cursor: default; }
  /* The format the question asked for — the primary one-click download. */
  .exbtn.exgen {
    border: 0; color: #fff; font-weight: 700;
    background: linear-gradient(135deg, var(--bo-purple), var(--bo-magenta) 60%, var(--bo-pink));
  }
  .exbtn.exgen:hover { color: #fff; filter: brightness(1.05); }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-treemap@2.3.0/dist/chartjs-chart-treemap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@sgratzl/chartjs-chart-boxplot@4.2.4/build/index.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
<header>
  <span id="brandMark" title="BayOne"></span>
  <h1><span class="wm">BayI</span> <span>Intelligence Agent</span> <span class="sub">— BayOne's Internal Intelligence</span></h1>
  <a href="/ingest" style="text-decoration:none"><button id="ingestBtn" title="Structure a file and load it into the knowledge base">Ingest</button></a>
  <button id="pdfBtn" title="Download the whole conversation as a PDF">Download PDF</button>
  <button id="newChat">New chat</button>
</header>

<div class="layout">
  <aside class="sidebar">
    <button class="primary sidebtn" id="newChatSide">+ New chat</button>
    <h2>Saved chats</h2>
    <div class="chatlist" id="chatList"></div>
  </aside>
  <div class="content">
    <main>
      <div class="thread" id="thread"></div>
    </main>

    <footer>
      <div id="attachChip" class="attach-chip" style="display:none"></div>
      <div class="composer">
        <input id="attachInput" type="file" hidden />
        <button id="attachBtn" title="Attach a file (a PowerPoint template, or a document to read)">📎</button>
        <textarea id="q" rows="1" placeholder="Ask a question — then follow up to analyze the result…"></textarea>
        <button class="primary" id="send">Send</button>
      </div>
      <div class="hint">Enter to send · Shift+Enter for newline · attach a .pptx template or a document to read</div>
    </footer>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const threadEl = $("#thread"), qEl = $("#q"), sendBtn = $("#send"), newChatBtn = $("#newChat"), pdfBtn = $("#pdfBtn");
const attachBtn = $("#attachBtn"), attachInput = $("#attachInput"), attachChip = $("#attachChip");
// The file attached to the NEXT message: {upload_id, filename, kind} or null. kind is
// "template" (a .pptx/.potx rendered onto at export) or "context" (a doc the model reads).
let pendingUpload = null;
// The agent always runs in Auto mode — it decides per question whether to use semantic
// search (Cortex Analyst) or raw SQL — so there's no query-method picker in the UI.
const TOOL = "auto";
const mainEl = document.querySelector("main");

// The BayOne mark: a four-segment donut (light pink -> magenta -> deep -> purple),
// the same glyph that sits inside the BAYONE wordmark. Rendered as inline SVG so it
// scales crisply and can be animated. `spin=true` gives the loading state. r=14 =>
// circumference ~87.96; each segment is a quarter (21.99) minus a 2px gap for the
// white dividers between colors.
function boMark(size, spin) {
  const seg = (color, off) =>
    `<circle cx="20" cy="20" r="14" fill="none" stroke="${color}" stroke-width="8"`
    + ` stroke-dasharray="19.99 67.97" stroke-dashoffset="${off}" transform="rotate(-90 20 20)"/>`;
  return `<svg class="bo-mark${spin ? " bo-spin" : ""}" width="${size}" height="${size}"`
    + ` viewBox="0 0 40 40" aria-hidden="true" focusable="false">`
    + seg("var(--bo-pink)", 0) + seg("var(--bo-magenta)", -21.99)
    + seg("var(--bo-deep)", -43.98) + seg("var(--bo-purple)", -65.97)
    + `</svg>`;
}

const LS_SESSION = "sf_session_id", LS_MSGS = "sf_messages", LS_CHATS = "sf_chats";
let sessionId = localStorage.getItem(LS_SESSION) || null;
let messages = JSON.parse(localStorage.getItem(LS_MSGS) || "[]"); // [{role, ...}]
// Saved chats live entirely in this browser's localStorage — one entry per conversation,
// [{id, title, messages, updated}]. `id` doubles as the server session_id. They are
// per-browser and hold the rendered transcript only; the raw rows that power follow-ups
// live in server memory and aren't restored across restarts (a reopened chat re-queries).
let chats = JSON.parse(localStorage.getItem(LS_CHATS) || "[]");
let busy = false;

function newId() {
  const raw = (crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2);
  return raw.replace(/-/g, "");
}

// Chart rendering state. botInner emits a <canvas> and queues its spec; charts are
// instantiated after the message is in the DOM (Chart.js needs a mounted canvas).
const INK = "#1e1630", MUTED = "#6b6480", GRID = "rgba(30,22,48,.09)";
const CHART_COLORS = ["#7c3aed","#d6249f","#a855f7","#ec4899","#6366f1","#c026d3","#8b5cf6","#f472b6","#4f46e5","#db2777"];
let chartSeq = 0, pendingCharts = [], chartInstances = {};

// Native document formats offered under every grounded answer. Each button posts the
// answer payload to /api/export, which renders a real Office/PDF file server-side.
const EXPORT_FORMATS = [
  { id: "xlsx", label: "Excel" },
  { id: "docx", label: "Word" },
  { id: "pptx", label: "PowerPoint" },
  { id: "pdf", label: "PDF" },
];

const EXAMPLES = [
  "How many distinct clients are there?",
  "What is the total bill rate across all placements?",
  "How many distinct primary skills are in the master skill list?",
  "Which client has the most placement rows?",
];

function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

// Render the small markdown subset the model actually emits (bold, italic, inline code,
// bullet and numbered lists, headings) into HTML. The answer prompt asks for markdown
// structure, so without this the user reads literal "**58 clients**" and "- " markers.
// XSS-safe by construction: the text is HTML-escaped FIRST, and only our own tags are
// added afterwards — no untrusted markup can survive.
function mdToHtml(text) {
  const inline = (s) => s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*(?!\s)([^*]+?)(?<!\s)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*(?!\s)([^*\n]+?)(?<!\s)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>")
    .replace(/(^|[\s(])_(?!\s)([^_\n]+?)(?<!\s)_(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>");

  const out = [];
  let list = null;                       // "ul" | "ol" | null
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const openList = (kind) => { if (list !== kind) { closeList(); out.push(`<${kind}>`); list = kind; } };

  for (const raw of esc(String(text || "")).split("\n")) {
    const line = raw.trim();
    if (!line) { closeList(); continue; }
    const heading = line.match(/^(#{1,4})\s+(.*)$/);
    const bullet = line.match(/^[-*•]\s+(.*)$/);
    const numbered = line.match(/^\d+[.)]\s+(.*)$/);
    if (heading) { closeList(); out.push(`<div class="ahead">${inline(heading[2])}</div>`); }
    else if (bullet) { openList("ul"); out.push(`<li>${inline(bullet[1])}</li>`); }
    else if (numbered) { openList("ol"); out.push(`<li>${inline(numbered[1])}</li>`); }
    else { closeList(); out.push(`<p>${inline(line)}</p>`); }
  }
  closeList();
  return out.join("");
}

// Known abbreviations that should stay upper-case in labels (ordinary all-caps
// field words like "CANDIDATE" are still Title-cased; only these are kept as acronyms).
const ACRONYMS = new Set([
  "ID","SOW","PO","PTO","USA","US","UK","EU","HPE","KPI","SLA","API","SQL","URL","SSN",
  "DOB","ZIP","HR","IT","QA","VP","CEO","CTO","CFO","CIO","B2B","B2C","AI","ML","FTE",
  "JD","EIN","W2","C2C","PII","CRM","ERP","SKU","YOY","MOM","YTD","MTD","NDA","RFP","RFQ", "USD","GM",
]);
// Turn a raw field key ("CANDIDATE FULL NAME", "solutions_case_study") into an
// English label ("Candidate Full Name", "Solutions Case Study"), keeping acronyms upper.
function humanize(k) {
  return String(k).replace(/[_\-]+/g, " ").replace(/\s+/g, " ").trim()
    .split(" ").map((w) => {
      const up = w.toUpperCase();
      if (ACRONYMS.has(up)) return up;                     // keep genuine acronyms upper
      if (w.length <= 2 && w === up) return w;             // short all-caps token (fallback)
      return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
    }).join(" ");
}
// Missing/null is flagged explicitly, never blanked out, so gaps in the data are visible.
// ── Deterministic value formatting ──────────────────────────────────────────────────
// Presentation is decided HERE, not by the model, so the same figure never renders three
// different ways across runs. Mirrors src/sf_agent/formatting.py — change both together;
// tests/test_formatting.py pins the shared cases.
//
// Type is inferred from the FIELD NAME because nothing upstream carries units. Matching is
// TOKEN-based, never bare substring: 'candidate_name' contains "date", 'corporate_client'
// contains "rate", and 'is_valid' ends in "id". Three rules come from the real data:
//   * never append "/hr" — AGREEDPAYRATE mixes hourly (55.00) and annual (140000.00);
//   * percents keep negatives and values over 100 — GM spans -89.50 to 118.60;
//   * numeric identifiers are never grouped — COMPANYID must not become 1,234,567.
const FALSE_FRIENDS = new Set(["candidate","candidates","update","updated","mandate","validate",
  "consolidate","corporate","accurate","separate","generate","aggregate","moderate","duration",
  "valid","invalid","paid","grid","hybrid"]);
const PERCENT_TOKENS = new Set(["pct","percent","percentage","margin","margins","gm","share","ratio"]);
const CURRENCY_TOKENS = new Set(["rate","rates","revenue","cost","costs","salary","price","spend",
  "billing","amount","budget","billrate","payrate","agreedbillrate","agreedpayrate","runrate"]);
const COUNT_TOKENS = new Set(["count","counts","headcount","placements","total","totals","num",
  "qty","quantity","rows","people","consultants","clients","n"]);
const DATE_TOKENS = new Set(["date","dates","day","month","year","period","at","start","end",
  "started","ended","expiry","expires","since","until"]);
const EXPLICIT_CURRENCY_TOKENS = new Set(["usd","dollar","dollars","amt"]);
const ISO_DATE_RE = /^\d{4}-\d{2}-\d{2}([ T].*)?$/;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function fmtTokens(key) {
  return String(key == null ? "" : key)
    .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
    .toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
}
function fmtHits(tokens, vocab) {
  return tokens.some((t) => {
    if (FALSE_FRIENDS.has(t)) return false;
    if (vocab.has(t)) return true;
    for (const w of vocab) if (w.length >= 3 && t.endsWith(w)) return true;
    return false;
  });
}
// "currency" | "percent" | "count" | "date" | "identifier" | "text"
function classifyField(key) {
  const raw = String(key == null ? "" : key).trim();
  if (!raw) return "text";
  const t = fmtTokens(raw);
  if (!t.length) return "text";
  if (t.includes("id") || /(^|_)id$/i.test(raw) ||
      t.some((x) => x.endsWith("id") && x.length > 3 && !FALSE_FRIENDS.has(x))) return "identifier";
  if (fmtHits(t, EXPLICIT_CURRENCY_TOKENS)) return "currency";  // margin_usd is money
  if (fmtHits(t, PERCENT_TOKENS)) return "percent";             // rate_pct is a percent
  if (fmtHits(t, CURRENCY_TOKENS)) return "currency";
  if (fmtHits(t, COUNT_TOKENS)) return "count";
  if (fmtHits(t, DATE_TOKENS)) return "date";
  return "text";
}
// Locale pinned to en-US so output never varies by viewer (bare toLocaleString() did).
function fmtGroup(n, dp) {
  return n.toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp });
}
function fmtTrim(s) { return s.includes(".") ? s.replace(/0+$/, "").replace(/\.$/, "") : s; }
function fmtCurrency(n) { return (n < 0 ? "-" : "") + "$" + fmtGroup(Math.abs(n), 2); }
function fmtPercent(n) { return fmtTrim(fmtGroup(n, 2)) + "%"; }
function fmtCount(n) { return Number.isInteger(n) ? fmtGroup(n, 0) : fmtTrim(fmtGroup(n, 1)); }
function fmtNumber(n) { return Number.isInteger(n) ? fmtGroup(n, 0) : fmtTrim(fmtGroup(n, 2)); }
function fmtDate(v) {
  const text = String(v).trim();
  if (!ISO_DATE_RE.test(text)) return null;
  const [y, m, d] = text.slice(0, 10).split("-").map(Number);
  if (!y || !m || !d || m > 12 || d > 31) return null;
  return `${MONTHS[m - 1]} ${d}, ${y}`;
}
// The headline badge has no field name of its own. Borrow the key of whichever `values`
// entry holds the same number (so a run-rate headline formats as currency like its table
// does); otherwise fall back to a plain grouped number, never a guessed unit.
function fmtHeadline(d) {
  const v = d.value;
  if (typeof v !== "number") return v;
  const vals = d.values || {};
  for (const [k, val] of Object.entries(vals)) {
    if (val === v) return fmtValue(v, k) ?? String(v);
    if (Array.isArray(val)) {
      for (const row of val) {
        if (isObj(row)) for (const [ck, cv] of Object.entries(row)) if (cv === v) return fmtValue(v, ck) ?? String(v);
      }
    } else if (isObj(val)) {
      for (const [ck, cv] of Object.entries(val)) if (cv === v) return fmtValue(v, ck) ?? String(v);
    }
  }
  return fmtNumber(v);
}

// The single entry point. Returns null when the value needs no special handling, so each
// caller keeps its own convention for blanks ("missing" on screen, "—" in documents).
function fmtValue(v, key) {
  if (v === null || v === undefined || v === "") return null;
  if (typeof v === "boolean") return v ? "Yes" : "No";
  const kind = classifyField(key);
  if (kind === "identifier") return String(v);
  if (kind === "date") { const d = fmtDate(v); if (d) return d; }
  const n = typeof v === "number" ? v : (typeof v === "string" && v.trim() !== "" && !isNaN(Number(v)) ? Number(v) : null);
  if (n === null) return fmtDate(v);
  if (kind === "currency") return fmtCurrency(n);
  if (kind === "percent") return fmtPercent(n);
  if (kind === "count") return fmtCount(n);
  return fmtNumber(n);
}

const isObj = (x) => x && typeof x === "object" && !Array.isArray(x);

// Render one cell value. Must handle NESTED structures: the agent's "values" often contain an
// object or list inside a table cell (e.g. a role category carrying its own titles, or a
// client carrying a per-region breakdown). esc() alone would stringify those as
// "[object Object]", which is what users were seeing. Recurses so any depth stays readable,
// with a JSON fallback as a backstop.
function cell(v, depth = 0, key = null) {
  if (v === null || v === undefined || v === "") return `<span class="vempty">missing</span>`;
  if (typeof v === "boolean") return v ? "Yes" : "No";
  // Numbers and dates are formatted deterministically from the field name (see fmtValue),
  // so 13278.7 reads $13,278.70 and 2026-07-31 reads Jul 31, 2026 — the same everywhere.
  const formatted = fmtValue(v, key);
  if (formatted !== null && typeof v !== "object") return esc(formatted);
  if (depth > 3) { try { return esc(JSON.stringify(v)); } catch { return esc(String(v)); } }
  if (Array.isArray(v)) {
    if (!v.length) return `<span class="vempty">none</span>`;
    // Objects stack on their own lines; scalars read as a comma list.
    return v.some(isObj)
      ? v.map((x) => cell(x, depth + 1, key)).join("<br>")
      : v.map((x) => cell(x, depth + 1, key)).join(", ");
  }
  if (isObj(v)) {
    const parts = Object.entries(v).map(([k, iv]) =>
      `<span class="kvp"><span class="kvk">${esc(humanize(k))}:</span> ${cell(iv, depth + 1, k)}</span>`);
    return parts.join(" · ") || `<span class="vempty">none</span>`;
  }
  return esc(v);
}

// Render a supporting value by shape: a list of row objects becomes a real table,
// a single object a key/value table, a scalar list a readable line, a scalar plain text.
function renderValue(v, key = null) {
  if (v === null || v === undefined || v === "") return `<p class="vscalar vempty">missing</p>`;
  if (Array.isArray(v)) {
    if (!v.length) return `<p class="vscalar vempty">missing</p>`;
    if (v.every(isObj)) {
      const cols = [...new Set(v.flatMap((r) => Object.keys(r)))];
      const head = cols.map((c) => `<th>${esc(humanize(c))}</th>`).join("");
      const body = v.map((r) => `<tr>${cols.map((c) => `<td>${cell(r[c], 0, c)}</td>`).join("")}</tr>`).join("");
      return `<div class="vscroll"><table class="data"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
    }
    return `<p class="vscalar">${v.map((item) => cell(item, 0, key)).join(v.some(isObj) ? "<br>" : ", ")}</p>`;
  }
  if (isObj(v)) {
    const rows = Object.entries(v).map(([k, iv]) =>
      `<tr><td class="k">${esc(humanize(k))}</td><td>${cell(iv, 0, k)}</td></tr>`).join("");
    return `<table class="data kv"><tbody>${rows}</tbody></table>`;
  }
  // Second raw-scalar path: a top-level scalar supporting value bypassed cell() entirely.
  return `<p class="vscalar">${cell(v, 0, key)}</p>`;
}

// Map the agent's normalized chart spec {type, title, labels, series, ...} to a
// Chart.js config. Colors follow the violet/magenta theme.
function chartConfig(spec) {
  const t = String(spec.type || "bar").toLowerCase();
  const labels = spec.labels || [];
  const series = spec.series || [];
  const pal = CHART_COLORS;
  const wantLegend = series.length > 1 || ["pie", "doughnut", "treemap"].includes(t);
  const plugins = {
    legend: { display: wantLegend, labels: { color: MUTED } },
    title: { display: !!spec.title, text: spec.title || "", color: INK, font: { size: 14 } },
  };
  // Axis + tooltip numbers go through the same formatter as the tables, keyed off the axis
  // label, so a chart never disagrees with the figures printed beside it.
  const vkey = spec.y_label || spec.title || "";
  const tick = (val) => { const f = fmtValue(val, vkey); return f === null ? val : f; };
  const axes = {
    x: { title: { display: !!spec.x_label, text: spec.x_label || "", color: MUTED }, ticks: { color: MUTED }, grid: { color: GRID } },
    y: { beginAtZero: true, title: { display: !!spec.y_label, text: spec.y_label || "", color: MUTED },
         ticks: { color: MUTED, callback: tick }, grid: { color: GRID } },
  };
  plugins.tooltip = { callbacks: { label: (c) => {
    const raw = (c.parsed && c.parsed.y !== undefined && c.parsed.y !== null) ? c.parsed.y : c.parsed;
    const f = fmtValue(raw, vkey);
    return `${c.dataset.label ? c.dataset.label + ": " : ""}${f === null ? raw : f}`;
  } } };
  const base = { responsive: true, maintainAspectRatio: false, plugins };

  if (t === "pie" || t === "doughnut") {
    return { type: t, data: { labels, datasets: [{ data: (series[0] || {}).data || [], backgroundColor: labels.map((_, i) => pal[i % pal.length]), borderColor: "#fff", borderWidth: 1 }] }, options: base };
  }
  if (t === "treemap") {
    const data = (series[0] || {}).data || [];
    return {
      type: "treemap",
      data: { datasets: [{ tree: labels.map((l, i) => ({ _l: l, _v: Number(data[i]) || 0 })), key: "_v",
        backgroundColor: (c) => pal[(c.dataIndex || 0) % pal.length],
        labels: { display: true, color: "#fff", formatter: (c) => (c.raw && c.raw._data ? c.raw._data._l : "") } }] },
      options: { ...base, plugins: { ...plugins, legend: { display: false } } },
    };
  }
  if (t === "scatter" || t === "bubble") {
    return { type: t, data: { datasets: series.map((s, i) => ({ label: s.name || `Series ${i + 1}`, data: s.data || [], backgroundColor: pal[i % pal.length] })) }, options: { ...base, scales: axes } };
  }
  if (t === "box") {
    return { type: "boxplot", data: { labels: labels.length ? labels : series.map((s, i) => s.name || `Box ${i + 1}`),
      datasets: series.map((s, i) => ({ label: s.name || `Box ${i + 1}`, data: s.data || [], backgroundColor: pal[i % pal.length] + "55", borderColor: pal[i % pal.length] })) },
      options: { ...base, scales: axes } };
  }
  // bar / column / line / area / histogram
  const isLine = t === "line" || t === "area";
  const histo = t === "histogram";
  return {
    type: isLine ? "line" : "bar",
    data: { labels, datasets: series.map((s, i) => ({
      label: s.name || `Series ${i + 1}`,
      data: s.data || [],
      backgroundColor: isLine ? pal[i % pal.length] + "33" : pal[i % pal.length],
      borderColor: pal[i % pal.length],
      borderWidth: isLine ? 2 : 0,
      fill: t === "area",
      tension: isLine ? 0.25 : 0,
      categoryPercentage: histo ? 1 : 0.8,
      barPercentage: histo ? 1 : 0.9,
    })) },
    options: { ...base, scales: axes },
  };
}

// Instantiate every queued chart now that its canvas is mounted. A bad spec or a
// missing CDN degrades to a small note; it never blanks the surrounding message.
function flushCharts() {
  const queued = pendingCharts; pendingCharts = [];
  for (const { id, spec } of queued) {
    const cv = document.getElementById(id);
    if (!cv) continue;
    if (typeof Chart === "undefined") { cv.closest(".chartwrap").innerHTML = `<div class="charterr">Chart library unavailable (offline).</div>`; continue; }
    try { chartInstances[id] = new Chart(cv.getContext("2d"), chartConfig(spec)); }
    catch (e) { const w = cv.closest(".chartwrap"); if (w) w.innerHTML = `<div class="charterr">Could not render chart: ${esc(e.message)}</div>`; }
  }
}

// Persist the *active* conversation (the one on screen) for reload continuity.
function persistActive() {
  if (sessionId) localStorage.setItem(LS_SESSION, sessionId); else localStorage.removeItem(LS_SESSION);
  localStorage.setItem(LS_MSGS, JSON.stringify(messages));
}
function persistChats() { localStorage.setItem(LS_CHATS, JSON.stringify(chats)); }

// A chat's sidebar label: its first user question, trimmed.
function chatTitle(msgs) {
  const first = msgs.find((m) => m.role === "user");
  const t = ((first && first.text) || "New chat").trim();
  return t.length > 60 ? t.slice(0, 57) + "…" : t;
}

// Fold the active conversation into the saved-chats list (skip empty ones).
function upsertChat() {
  if (!sessionId || !messages.length) return;
  const entry = { id: sessionId, title: chatTitle(messages), messages, updated: Date.now() };
  const idx = chats.findIndex((c) => c.id === sessionId);
  if (idx >= 0) chats[idx] = entry; else chats.push(entry);
}

// Called after each turn changes the active chat: persist everything + redraw the list.
function save() {
  persistActive();
  upsertChat();
  persistChats();
  renderChats();
}

function renderChats() {
  const list = $("#chatList");
  if (!list) return;
  const sorted = chats.slice().sort((a, b) => (b.updated || 0) - (a.updated || 0));
  if (!sorted.length) { list.innerHTML = `<div class="chat-empty">No saved chats yet</div>`; return; }
  list.innerHTML = sorted.map((c) =>
    `<div class="chat-item${c.id === sessionId ? " active" : ""}" data-id="${esc(c.id)}">`
    + `<span class="chat-title">${esc(c.title)}</span>`
    + `<button class="chat-del" data-del="${esc(c.id)}" title="Delete chat">×</button>`
    + `</div>`
  ).join("");
}

function loadChat(id) {
  if (busy || id === sessionId) return;
  const c = chats.find((x) => x.id === id);
  if (!c) return;
  sessionId = c.id;
  messages = JSON.parse(JSON.stringify(c.messages)); // clone so edits don't alias the store
  persistActive();
  renderAll();
  renderChats();
}

function deleteChat(id) {
  chats = chats.filter((c) => c.id !== id);
  persistChats();
  // Best-effort: free the chat's server-side memory too.
  try {
    fetch("/api/reset", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: "", session_id: id }),
    });
  } catch {}
  if (id === sessionId) { sessionId = null; messages = []; persistActive(); renderAll(); }
  renderChats();
}
function scrollDown() { mainEl.scrollTop = mainEl.scrollHeight; }

// Human-facing labels + one-line descriptions for each router verdict. The colored
// dot (CSS, per .route-<route>) tells the three paths apart at a glance.
const ROUTES = {
  database: { label: "Database", desc: "Queried the Snowflake warehouse" },
  followup: { label: "Follow-up", desc: "Answered from the previous turn's data" },
  web: { label: "Web search", desc: "Searched the internet" },
};

// The transparency pill: shows which path answered this question, plus the router's
// one-line reason. Rendered at the very top of every bot answer.
function routePill(d) {
  if (!d.route || !ROUTES[d.route]) return "";
  const r = ROUTES[d.route];
  const reason = d.route_reason ? ` — ${esc(d.route_reason)}` : "";
  return `<div class="route route-${esc(d.route)}"><span class="rdot"></span>`
    + `<span class="rlab">${esc(r.label)}</span><span class="rreason">${reason}</span></div>`;
}

// Source citations for the web route: a titled list of the pages the answer drew on.
function citations(d) {
  const c = d.citations || [];
  if (!c.length) return "";
  const items = c.map((x) => {
    const label = esc(x.title || x.url || "source");
    const url = x.url ? esc(x.url) : "";
    return url
      ? `<li><a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a></li>`
      : `<li>${label}</li>`;
  }).join("");
  return `<div class="klabel">Sources (${c.length})</div><ul class="cites">${items}</ul>`;
}

function botInner(d) {
  let html = "";
  if (!d.ok) return `<p class="answer">${esc(d.error)}</p>`;
  html += routePill(d);
  if (d.value !== null && d.value !== undefined && d.value !== "")
    html += `<div class="badge">${esc(fmtHeadline(d))}</div>`;
  html += `<div class="answer">${mdToHtml(d.answer)}</div>`;
  if (d.chart && typeof d.chart === "object") {
    const id = `chart_${chartSeq++}`;
    pendingCharts.push({ id, spec: d.chart });
    html += `<div class="klabel">Visualization</div><div class="chartwrap"><canvas id="${id}"></canvas></div>`;
  }
  const vals = d.values || {};
  if (Object.keys(vals).length) {
    html += `<div class="klabel">Supporting values</div>`;
    for (const [k, v] of Object.entries(vals))
      html += `<div class="vsection"><div class="vname">${esc(humanize(k))}</div>${renderValue(v, k)}</div>`;
  }
  const sql = d.executed_sql || [];
  if (sql.length) {
    html += `<details><summary>Executed SQL (${sql.length})</summary>`;
    html += sql.map((s) => `<pre>${esc(s)}</pre>`).join("");
    html += `</details>`;
  }
  html += diagnostics(d);
  html += exportBar(d);
  return html;
}

// The download-as-document toolbar shown beneath every grounded answer. Buttons carry
// only the format; the click handler resolves which answer they belong to from the DOM.
// When the question itself asked for a document (d.export_format), nothing is downloaded
// automatically — the bar invites the user to download that format, styling its button as
// the primary action, while the other buttons still offer the remaining formats.
function exportBar(d) {
  const gen = d && d.export_format;
  const genLabel = gen ? ((EXPORT_FORMATS.find((f) => f.id === gen) || {}).label || gen) : null;
  const lead = gen
    ? `<span class="exlabel">You asked for a ${esc(genLabel)} — download it:</span>`
    : `<span class="exlabel">Export</span>`;
  return `<div class="exportbar">${lead}`
    + EXPORT_FORMATS.map((f) =>
        `<button class="exbtn${f.id === gen ? " exgen" : ""}" data-fmt="${f.id}">`
        + `${f.id === gen ? "⬇ " : ""}${esc(f.label)}</button>`).join("")
    + `</div>`;
}

// The user question that produced the bot answer at message index `idx` — the nearest
// preceding user turn. Becomes the exported document's title and filename.
function questionFor(idx) {
  for (let i = idx - 1; i >= 0; i--) if (messages[i].role === "user") return messages[i].text || "";
  return "";
}

// POST the grounded answer to the server, which renders a native file, then trigger a
// browser download of the returned blob. Returns the downloaded filename. Shared by the
// Export buttons and by the auto-generate path (when the question asked for a document).
async function downloadExport(fmt, data, question) {
  const r = await fetch("/api/export", {
    method: "POST", headers: { "Content-Type": "application/json" },
    // template_id (when the answer was produced with an attached .pptx template) renders
    // the deck onto that template; ignored server-side for non-pptx or when expired.
    // template_mode rides along so "same headers and theme" keeps the uploaded deck's
    // section titles, while a bare "in the same theme" only inherits its look.
    body: JSON.stringify({ format: fmt, question, answer: data,
      template_id: data.template_id || null, template_mode: data.template_mode || "theme" }),
  });
  if (!r.ok) {
    let msg = "Export failed";
    try { const j = await r.json(); msg = j.error || msg; } catch {}
    throw new Error(msg);
  }
  const blob = await r.blob();
  const cd = r.headers.get("Content-Disposition") || "";
  const m = cd.match(/filename="?([^"]+)"?/);
  const name = m ? m[1] : `bayi-report.${fmt}`;
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  // Revoke LATER, not synchronously: revoking the object URL right after click() can
  // cancel the still-starting download in some browsers and truncate the file (which
  // then opens as "invalid format"). A delayed revoke lets the download finish first.
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return name;
}

// Export button click: download with an inline "…" progress state on the button.
async function exportDoc(fmt, data, question, btn) {
  const prev = btn.textContent;
  btn.disabled = true; btn.textContent = "…";
  try {
    await downloadExport(fmt, data, question);
  } catch (e) {
    alert("Could not export: " + (e && e.message ? e.message : e));
  } finally {
    btn.disabled = false; btn.textContent = prev;
  }
}

// Format a USD cost that is usually a fraction of a cent.
function fmtCost(c) {
  if (c == null) return null;
  if (c === 0) return "$0.00";
  if (c < 0.0001) return "<$0.0001";
  return "$" + c.toFixed(c < 0.01 ? 4 : 2);
}

// Small collapsible diagnostics panel at the bottom of each answer: how long it
// took, which tables it drew from, tokens used, and estimated cost.
function diagnostics(d) {
  const rows = [];
  if (d.route && ROUTES[d.route])
    rows.push(["Route", ROUTES[d.route].label + (d.route_reason ? ` — ${d.route_reason}` : "")]);
  if (typeof d.elapsed_ms === "number")
    rows.push(["Time taken", (d.elapsed_ms / 1000).toFixed(1) + " s"]);
  const src = (d.sources && d.sources.length) ? d.sources.join(", ") : (d.tool || "agent");
  rows.push(["Source", src]);
  // Provenance lives HERE only: warehouse tables above, web pages below. The answer body
  // stays clean prose, so every response has the same shape whatever route produced it.
  const cites = d.citations || [];
  if (cites.length) {
    const links = cites.map((c) => {
      const label = esc(c.title || c.url || "source");
      return c.url ? `<li><a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">${label}</a></li>` : `<li>${label}</li>`;
    }).join("");
    rows.push(["Sources", `<ul class="cites">${links}</ul>`, true]);
  }
  const tk = d.tokens || {};
  if (tk.total)
    rows.push(["Tokens used", `${fmtCount(tk.total)} total — ${fmtCount(tk.input || 0)} in, `
      + `${fmtCount(tk.output || 0)} out, ${fmtCount((tk.cache_read || 0) + (tk.cache_write || 0))} cache`]);
  const cost = fmtCost(d.cost_usd);
  if (cost) rows.push(["Token cost", cost]);
  const body = rows.map(([k, v, isHtml]) =>
    `<tr><td class="k">${esc(k)}</td><td>${isHtml ? v : esc(v)}</td></tr>`).join("");
  return `<details class="diag"><summary>Diagnostics · via ${esc(d.tool || "agent")}</summary>`
    + `<table class="data kv"><tbody>${body}</tbody></table></details>`;
}

function renderMessage(m, idx) {
  const wrap = document.createElement("div");
  if (m.role === "user") {
    wrap.className = "msg user";
    const att = m.attachment
      ? `<div class="msg-attach">📎 ${esc(m.attachment.filename)}${m.attachment.kind === "template" ? " (template)" : ""}</div>`
      : "";
    wrap.innerHTML = `<div class="bubble">${esc(m.text)}${att}</div>`;
  } else {
    wrap.className = "msg bot" + (m.data && m.data.ok === false ? " err" : "");
    wrap.dataset.msgIndex = idx; // so the export buttons can find this answer's payload
    wrap.innerHTML = `<div class="bubble">${botInner(m.data)}</div>`;
  }
  return wrap;
}

function renderAll() {
  // Full redraw: tear down existing charts so their canvases (about to be removed) don't leak.
  for (const id in chartInstances) { try { chartInstances[id].destroy(); } catch (e) {} }
  chartInstances = {}; pendingCharts = [];
  pdfBtn.disabled = !messages.length; // nothing to export on an empty chat
  threadEl.innerHTML = "";
  if (!messages.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = `<div>Ask a question about the warehouse. Every answer is grounded in a live query.</div>
      <div class="chips">${EXAMPLES.map((x) => `<span class="chip">${esc(x)}</span>`).join("")}</div>`;
    threadEl.appendChild(e);
    return;
  }
  messages.forEach((m, i) => threadEl.appendChild(renderMessage(m, i)));
  flushCharts();
  scrollDown();
}

// --- File attachment ----------------------------------------------------------------
// Show (or clear) the pending-attachment chip above the composer.
function renderAttachChip() {
  if (!pendingUpload) { attachChip.style.display = "none"; attachChip.innerHTML = ""; return; }
  const isTpl = pendingUpload.kind === "template";
  attachChip.style.display = "";
  attachChip.innerHTML = `<span class="attach-pill">`
    + `<span class="ap-kind ${isTpl ? "template" : ""}">${isTpl ? "Template" : "Context"}</span>`
    + `<span class="ap-name">${esc(pendingUpload.filename)}</span>`
    + `<button class="ap-x" title="Remove attachment">×</button></span>`;
}
function clearAttach() { pendingUpload = null; attachInput.value = ""; renderAttachChip(); }

// Upload a chosen file: the server classifies it (template vs context) and holds it,
// returning an upload_id the next send() references.
async function uploadFile(file) {
  if (!file || busy) return;
  attachBtn.classList.add("busy"); attachBtn.disabled = true;
  try {
    const fd = new FormData(); fd.append("file", file);
    const r = await fetch("/api/upload", { method: "POST", body: fd });
    const data = await r.json();
    if (!r.ok || !data.ok) throw new Error(data.error || "Upload failed");
    pendingUpload = { upload_id: data.upload_id, filename: data.filename, kind: data.kind };
    renderAttachChip();
  } catch (e) {
    alert("Could not attach file: " + (e && e.message ? e.message : e));
    clearAttach();
  } finally {
    attachBtn.classList.remove("busy"); attachBtn.disabled = false;
  }
}

async function send() {
  const question = qEl.value.trim();
  if (!question || busy) return;
  busy = true; sendBtn.disabled = true;
  // Take this turn's attachment (if any) and clear the composer chip.
  const attach = pendingUpload;
  clearAttach();
  // Give the chat a stable id up front so it can be saved before the server replies.
  // We pass it as session_id; the backend adopts a client-supplied id as-is.
  if (!sessionId) sessionId = newId();
  messages.push({ role: "user", text: question, attachment: attach || null });
  qEl.value = ""; autosize();
  renderAll(); save();

  // Loading indicator: the spinning BayOne logo mark, no text.
  const typing = document.createElement("div");
  typing.className = "msg bot";
  typing.innerHTML = `<div class="bubble loading">${boMark(30, true)}</div>`;
  threadEl.appendChild(typing); scrollDown();

  let data;
  try {
    const r = await fetch("/api/ask", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, tool: TOOL, session_id: sessionId, upload_id: attach ? attach.upload_id : null }),
    });
    data = await r.json();
    if (data.session_id) sessionId = data.session_id;
  } catch (e) {
    data = { ok: false, error: "Request failed: " + e.message };
  }
  typing.remove();
  messages.push({ role: "bot", data });
  busy = false; sendBtn.disabled = false;
  renderAll(); save();
  qEl.focus();
  // Note: when the question asked for a document (data.export_format), we do NOT download
  // automatically — the answer's export bar surfaces a highlighted one-click download for
  // that format, so the user chooses when (and whether) to generate the file.
}

// Rasterize the whole thread (charts and tables included) and slice it into an
// A4 PDF the user can save. html2canvas captures the element's full scroll height,
// so the entire conversation is exported, not just what's on screen.
async function downloadPdf() {
  if (busy || !messages.length) return;
  if (typeof html2canvas === "undefined" || !window.jspdf) {
    alert("PDF libraries are unavailable (offline). Reconnect and reload to export.");
    return;
  }
  const prev = pdfBtn.textContent;
  pdfBtn.disabled = true; pdfBtn.textContent = "Preparing…";
  const wasBottom = mainEl.scrollTop; // restore scroll after capture
  try {
    const bg = getComputedStyle(document.body).backgroundColor || "#faf8ff";
    const canvas = await html2canvas(threadEl, {
      backgroundColor: bg, scale: 2, useCORS: true, windowWidth: threadEl.scrollWidth,
    });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: "pt", format: "a4" });
    const margin = 24;
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgW = pageW - margin * 2;
    const ratio = imgW / canvas.width;              // canvas px -> pdf pt
    const sliceH = Math.floor((pageH - margin * 2) / ratio); // source px per page
    let y = 0, page = 0;
    while (y < canvas.height) {
      const h = Math.min(sliceH, canvas.height - y);
      const slice = document.createElement("canvas");
      slice.width = canvas.width; slice.height = h;
      slice.getContext("2d").drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
      if (page > 0) pdf.addPage();
      pdf.addImage(slice.toDataURL("image/png"), "PNG", margin, margin, imgW, h * ratio);
      y += h; page++;
    }
    pdf.save(`bayone-chat-${new Date().toISOString().slice(0, 10)}.pdf`);
  } catch (e) {
    alert("Could not generate PDF: " + (e && e.message ? e.message : e));
  } finally {
    pdfBtn.textContent = prev; pdfBtn.disabled = !messages.length;
    mainEl.scrollTop = wasBottom;
  }
}

function newChat() {
  if (busy) return;
  // The current chat is already saved in the sidebar (save() runs after every turn),
  // so New chat just starts a fresh conversation — it no longer wipes server memory,
  // leaving the prior chat's context intact for when it's reopened this session.
  sessionId = null; messages = [];
  persistActive(); renderAll(); renderChats(); qEl.focus();
}

function autosize() { qEl.style.height = "auto"; qEl.style.height = Math.min(qEl.scrollHeight, 180) + "px"; }

sendBtn.addEventListener("click", send);
attachBtn.addEventListener("click", () => { if (!busy) attachInput.click(); });
attachInput.addEventListener("change", () => { if (attachInput.files[0]) uploadFile(attachInput.files[0]); });
attachChip.addEventListener("click", (e) => { if (e.target.classList.contains("ap-x")) clearAttach(); });
newChatBtn.addEventListener("click", newChat);
$("#newChatSide").addEventListener("click", newChat);
$("#chatList").addEventListener("click", (e) => {
  const del = e.target.closest("[data-del]");
  if (del) { deleteChat(del.getAttribute("data-del")); return; }
  const item = e.target.closest(".chat-item");
  if (item) loadChat(item.getAttribute("data-id"));
});
pdfBtn.addEventListener("click", downloadPdf);
qEl.addEventListener("input", autosize);
qEl.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
threadEl.addEventListener("click", (e) => {
  if (e.target.classList.contains("chip")) { qEl.value = e.target.textContent; autosize(); qEl.focus(); return; }
  const ex = e.target.closest(".exbtn");
  if (ex) {
    const bot = ex.closest(".msg.bot");
    const idx = bot ? Number(bot.dataset.msgIndex) : -1;
    const m = messages[idx];
    if (m && m.data && m.data.ok !== false) exportDoc(ex.getAttribute("data-fmt"), m.data, questionFor(idx), ex);
  }
});

document.getElementById("brandMark").innerHTML = boMark(28, false);
renderAll();
renderChats();
</script>
</body>
</html>
